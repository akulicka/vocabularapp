services:
# TODO DOCKER IGNORE
  db:
    image: mysql:9.6
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      default:
        ipv4_address: 172.28.0.1
    volumes:
        - ${MYSQL_DIR}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  backend:
    build:    
      context: .
      dockerfile: ./backend/Dockerfile
      args:
          # Compose: BUILD_ARG=development (npm run development). Dockerfile default is the same.
          BUILD_ARG: ${BUILD_ARG}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      default:
        ipv4_address: 172.28.0.2
    environment:
      # Do not interpolate DB_HOST/DB_PORT from the CLI .env; this service always uses db:3306.
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TOKEN_SECRET: ${TOKEN_SECRET}
      PATH_TO_CERT: ${MOUNTED_BACKEND_CERT_DIR}/${PATH_TO_CERT}
      PATH_TO_KEY: ${MOUNTED_BACKEND_CERT_DIR}/${PATH_TO_KEY}
      VERIFY_EMAIL: ${VERIFY_EMAIL}
      IMAGE_BUCKET: ${IMAGE_BUCKET}
      STORAGE_CLOUD_PROJECT: ${STORAGE_CLOUD_PROJECT}
      BEHIND_TLS_PROXY: ${BEHIND_TLS_PROXY}
      MAILGUN_KEY: ${MAILGUN_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      # SPA on nginx :80. Do not use WSL HOST_DOMAIN (Vite :5173).
      HOST_DOMAIN: http://localhost
      GOOGLE_APPLICATION_CREDENTIALS: ${MOUNTED_GCLOUD_CREDS_DIR}/${GCLOUD_CREDS_FILE}
    volumes:
      - ${LOCAL_CERT_DIR}:${MOUNTED_BACKEND_CERT_DIR}
      - ${LOCAL_GCLOUD_CREDS_DIR}:${MOUNTED_GCLOUD_CREDS_DIR}
  frontend:
    build: 
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        # Compose: BUILD_ARG=development (vite build -m development → frontend/.env.development).
        BUILD_ARG: ${BUILD_ARG}
    environment:
      PORT: "80"
    ports:
      - "80:80"
    #  - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.3
    # volumes:
    # - ${LOCAL_CERT_DIR}:${MOUNTED_FRONTEND_CERT_DIR}
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: 172.28.5.254
          aux_addresses:
            host1: 172.28.1.5
            host2: 172.28.1.6
            host3: 172.28.1.7